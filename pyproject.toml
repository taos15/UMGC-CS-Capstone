[project]
name = "skillmatch-ai"
version = "0.1.0"
description = "SkillMatch AI is an alpha workforce-matching prototype that recommends employees for jobs based on skills, certifications, and experience rather than job title alone."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.13.5",
    "PyJWT==2.14.0",
    "sqlalchemy==2.0.36",
    "sqlmodel==0.0.47",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.15.6",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src"]
include = ["skillmatch*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["skillmatch"]

[tool.coverage.report]
show_missing = true
